spring.application.name=ai-minions-ai-service
server.port=8080
api.base.path=ai_service/api/v1

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.datasource.url=jdbc:postgresql://ep-small-rain-a14bcpc0-pooler.ap-southeast-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_4liS3wxVMKDj&sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_4liS3wxVMKDj
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (required for default app.session.backend=redis; use docker-compose.yml locally)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:mypassword}
spring.data.redis.timeout=3s

# Spring Cache → Redis (see RoleLookupService; align with Booking-System-Java-style stack)
spring.cache.type=redis
spring.cache.redis.cache-null-values=false
spring.cache.redis.time-to-live=${APP_CACHE_TTL_MS:3600000}
spring.cache.redis.key-prefix=ai-minions:cache:

# account-session: redis (default) | memory (tests / no Redis)
app.session.backend=${APP_SESSION_BACKEND:redis}

# JWT
app.jwt.issuer=${APP_JWT_ISSUER:ai-minions}
app.jwt.secret=${APP_JWT_SECRET:please-change-this-secret-to-32-chars-minimum}
app.jwt.access-token-ttl-seconds=${APP_JWT_ACCESS_TTL_SECONDS:3600}

# Auth
app.auth.expose-otp=${APP_AUTH_EXPOSE_OTP:false}
app.auth.expose-reset-token=${APP_AUTH_EXPOSE_RESET_TOKEN:false}
app.auth.otp-ttl-seconds=${APP_AUTH_OTP_TTL_SECONDS:300}
app.auth.reset-ttl-seconds=${APP_AUTH_RESET_TTL_SECONDS:900}

# Default AI provider
ai.default-provider=GEMINI

# Open AI
openai.api-key=
openai.api-url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# Gemini AI
gemini.api-key=
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/
gemini.model=gemini-flash-lite-latest

# Translation defaults
translate.default.source=English
translate.default.target=Myanmar
translate.max-characters=1500
