# Production runtime threading (toggle via env when needed).
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:true}

# Reduce SQL/log noise in production.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.aiminion.aiservice=${LOG_LEVEL_AI_SERVICE:INFO}

# Keep request body size configurable.
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:512MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:512MB}
