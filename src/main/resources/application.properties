spring.application.name=ai-minions-ai-service

server.port=8080
api.base.path=ai_service/api/v1

# Multipart: processing worker sends cleaned WAV directly (no intermediate upload)
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.datasource.url=
spring.datasource.password=
spring.datasource.driver-class-name=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (required for default app.session.backend=redis; use docker-compose.yml locally)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:mypassword}
spring.data.redis.timeout=3s

# Spring Cache → Redis (see RoleLookupService; align with Booking-System-Java-style stack)
spring.cache.type=redis
spring.cache.redis.cache-null-values=false
spring.cache.redis.time-to-live=${APP_CACHE_TTL_MS:3600000}
spring.cache.redis.key-prefix=ai-minions:cache:

# account-session: redis (default) | memory (tests / no Redis)
app.session.backend=${APP_SESSION_BACKEND:redis}

# JWT
app.jwt.issuer=${APP_JWT_ISSUER:ai-minions}
app.jwt.secret=${APP_JWT_SECRET:please-change-this-secret-to-32-chars-minimum}
app.jwt.access-token-ttl-seconds=${APP_JWT_ACCESS_TTL_SECONDS:3600}

# Spring AI → Google GenAI (same stack as voice-dictation: spring-ai-starter-model-google-genai)
spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY:${GEMINI_API_KEY:}}
spring.ai.google.genai.chat.options.model=${GEN_AI_CHAT_MODEL:gemini-flash-lite-latest}
spring.ai.google.genai.chat.options.temperature=0.2

# REST Gemini client (translate/content via GeminiClient) — falls back to Spring AI key property
gemini.api-key=${GEMINI_API_KEY:${GOOGLE_AI_API_KEY:${spring.ai.google.genai.api-key:}}}
gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# Gemini Imagen (image generation)
gemini.imagen.api-url=${GEMINI_IMAGEN_API_URL:https://generativelanguage.googleapis.com/v1beta/models/}
gemini.imagen.model=${GEMINI_IMAGEN_MODEL:imagen-4.0-generate-001}

# Transcribe-only model override (voice-dictation TRANSCRIBE_MODEL)
app.google-ai.transcribe-model=${GOOGLE_AI_TRANSCRIBE_MODEL:gemini-flash-lite-latest}

# Default provider for translate / content features (AiClientFactory, AiContentTextGenerator)
ai.default-provider=${AI_DEFAULT_PROVIDER:GEMINI}

# OpenAI (translate, content generation when provider is OPENAI)
openai.api-key=${OPENAI_API_KEY:}
openai.api-url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.image-api-url=${OPENAI_IMAGE_API_URL:https://api.openai.com/v1/images/generations}
openai.image-model=${OPENAI_IMAGE_MODEL:dall-e-3}

# Translation defaults (documentation / future use; TranslateAiService uses its own constants today)
translate.default.source=${TRANSLATE_DEFAULT_SOURCE:English}
translate.default.target=${TRANSLATE_DEFAULT_TARGET:Myanmar}
translate.max-characters=${TRANSLATE_MAX_CHARACTERS:1500}

# Auth
app.auth.expose-otp=${APP_AUTH_EXPOSE_OTP:false}
app.auth.expose-reset-token=${APP_AUTH_EXPOSE_RESET_TOKEN:false}
app.auth.otp-ttl-seconds=${APP_AUTH_OTP_TTL_SECONDS:300}
app.auth.reset-ttl-seconds=${APP_AUTH_RESET_TTL_SECONDS:900}
